name: Flake validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check flake
    runs-on: nixos-latest
    steps:
      - name: Install Node.js 24
        run: |
          nix profile install nixpkgs#nodejs_24
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"
          "$HOME/.nix-profile/bin/node" --version

      - name: Check out repository
        uses: https://code.forgejo.org/actions/checkout@v4

      - name: Validate flake
        run: nix flake check --no-build --show-trace
