name: Build everything
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  hosts:
    name: List hosts
    runs-on: nixos-latest
    outputs:
      hosts: ${{ steps.hosts.outputs.hosts }}
    steps:
      - name: Install Node.js 24
        run: |
          nix profile add nixpkgs#nodejs_24
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"
      - name: Check out repository
        uses: actions/checkout@v6
      - name: List hosts
        id: hosts
        run: |
          echo "hosts=$(nix eval --json path:.#nixosConfigurations --apply builtins.attrNames)" >> "$GITHUB_OUTPUT"
  build:
    name: Build ${{ matrix.host }}
    needs: hosts
    runs-on: nixos-latest
    enable-openid-connect: true
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.hosts.outputs.hosts) }}
    steps:
      - name: Install Node.js 24
        run: |
          nix profile add nixpkgs#nodejs_24
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Configure niks3 cache
        uses: https://github.com/Mic92/niks3-action@v1.5.0
        with:
          server-url: https://amber.asnk.io
      - name: Build ${{ matrix.host }}
        run: nix build --print-build-logs --no-link "path:.#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel"
  outputs:
    name: Build checks and packages
    runs-on: nixos-latest
    enable-openid-connect: true
    steps:
      - name: Install Node.js 24
        run: |
          nix profile add nixpkgs#nodejs_24
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Configure niks3 cache
        uses: https://github.com/Mic92/niks3-action@v1.5.0
        with:
          server-url: https://amber.asnk.io
      - name: Build checks and packages
        run: |
          installables=()
          for output in checks packages; do
            for name in $(nix eval --raw "path:.#$output.x86_64-linux" \
                --apply 'xs: builtins.concatStringsSep " " (builtins.attrNames xs)'); do
              installables+=("path:.#$output.x86_64-linux.$name")
            done
          done
          nix build --print-build-logs --no-link "${installables[@]}"
