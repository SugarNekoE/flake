apiVersion: v1
kind: List
items:
  - apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata:
      name: acs-forgejo-registration
      namespace: forgejo-runners
    spec:
      refreshInterval: 1h
      secretStoreRef:
        name: acs-secret-store
        kind: ClusterSecretStore
      target:
        name: acs-forgejo-registration
        creationPolicy: Owner
        template:
          type: Opaque
      data:
        - secretKey: token
          remoteRef:
            key: ci/forgejo/registration-token
  - apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata:
      name: acs-forgejo-scaler
      namespace: forgejo-runners
    spec:
      refreshInterval: 1h
      secretStoreRef:
        name: acs-secret-store
        kind: ClusterSecretStore
      target:
        name: acs-forgejo-scaler
        creationPolicy: Owner
        template:
          type: Opaque
      data:
        - secretKey: token
          remoteRef:
            key: ci/forgejo/queue-read-pat
  - apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata:
      name: acs-acr-pull
      namespace: forgejo-runners
    spec:
      refreshInterval: 1h
      secretStoreRef:
        name: acs-secret-store
        kind: ClusterSecretStore
      target:
        name: acs-acr-pull
        creationPolicy: Owner
        template:
          type: kubernetes.io/dockerconfigjson
      data:
        - secretKey: .dockerconfigjson
          remoteRef:
            key: ci/acr/docker-config-json
